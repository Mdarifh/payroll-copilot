# Demo data for the payroll chatbot. Fictional company and people (local SQLite only).
# Focus payroll month: September 2026. August 2026 is the previous (history) month.
#
# Attendance is generated per day: Sundays = WEEK_OFF, company holidays = HOLIDAY,
# approved leaves = LEAVE, listed absences = ABSENT, every other employed day = PRESENT.
# An ABSENT day without an approved leave is an "attendance exception" (Phase 4 LOP flow).
#
# Demo logins (change them before sharing the app):
#   employees: <email> / Employee@123      HR: anjali.mehta@example.com / Hr@12345

attendance_months: ["2026-08", "2026-09"]
# Months whose payroll is already processed (by the HR user) - employees can ask for
# these payslips. September is left for HR to run from the chat (Phase 4).
processed_months: ["2026-08"]
# Generated extra employees (EMP-201 ...): repeatable fake names, departments, states and
# salaries; about 20% have unapproved absences in September. 0 = none.
dummy_employees: 50

holidays:
  - {day: 2026-08-15, name: Independence Day}
  - {day: 2026-09-14, name: Ganesh Chaturthi}

passwords:
  employee: Employee@123
  manager: Manager@123
  hr: Hr@12345
  payroll_manager: Hr@12345
  payroll_executive: Hr@12345
  viewer: Hr@12345

# office per work state (employees without an explicit location get this)
locations: {MH: Mumbai, KA: Bengaluru, WB: Kolkata, TN: Chennai, TG: Hyderabad, DL: Delhi,
            GJ: Ahmedabad, UP: Noida, HR: Gurugram}
# reporting manager per department (manager role sees only their team, never amounts)
department_managers: {Engineering: MGR-001}

employees:
  - employee_code: EMP-101
    scenario: Normal month in Aug; one unapproved absence in Sep (LOP decision needed)
    full_name: Rahul Verma
    email: rahul.verma@example.com
    gender: M
    dob: 1990-05-14
    doj: 2022-04-01
    work_state: MH
    department: Engineering
    designation: Senior Engineer
    uan: "100000000101"
    pan: ABCPV1234K
    pf_join_date: 2022-04-01
    tax_regime: NEW
    salary: {template: STD-2026, monthly_gross: 60000, effective_from: 2026-04-01}
    leaves:
      - {leave_type: EL, from_date: 2026-08-17, to_date: 2026-08-19, status: APPROVED, reason: Family function}
    absences: [2026-09-22]

