# Demo payroll data for development and tests. Fictional company and people.
# Focus month: September 2026 (30 days, Sundays 6/13/20/27 are week offs).
# August 2026 rows exist where needed for arrears / LOP reversal.

company:
  code: DEMO
  name: Demo Tech Pvt Ltd
  state_code: MH
  pf_establishment_code: MHDEM0000001000
  esic_employer_code: "31000000000000001"
  paid_days_basis: CALENDAR

salary_heads:
  # code, name, category, head_type + flags. Flags drive PF/ESIC/PT/tax wage bases.
  - {code: BASIC, name: Basic, category: EARNING, head_type: FIXED, is_taxable: true, is_pf_wage: true, is_esic_wage: true, is_pt_wage: true, is_lwf_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 1}
  - {code: HRA, name: House Rent Allowance, category: EARNING, head_type: FIXED, is_taxable: true, is_esic_wage: true, is_pt_wage: true, is_lwf_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 2}
  - {code: SPECIAL, name: Special Allowance, category: EARNING, head_type: FIXED, is_taxable: true, is_esic_wage: true, is_pt_wage: true, is_lwf_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 3}
  - {code: CONVEYANCE, name: Conveyance Allowance, category: EARNING, head_type: FIXED, is_taxable: true, is_esic_wage: true, is_pt_wage: true, is_lwf_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 4}
  - {code: MEDICAL, name: Medical Allowance, category: EARNING, head_type: FIXED, is_taxable: true, is_esic_wage: true, is_pt_wage: true, is_lwf_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 5}
  - {code: BONUS, name: Bonus, category: EARNING, head_type: VARIABLE, is_taxable: true, is_pt_wage: true, part_of_gross: true, part_of_ctc: true, display_order: 6}
  - {code: OTHER_EARNING, name: Other Earnings, category: EARNING, head_type: ADHOC, is_taxable: true, is_pt_wage: true, part_of_gross: true, display_order: 7}
  - {code: LEAVE_ENCASH, name: Leave Encashment, category: EARNING, head_type: ADHOC, is_taxable: true, part_of_gross: true, display_order: 8}

  - {code: EE_PF, name: Employee PF, category: DEDUCTION, head_type: STATUTORY, display_order: 20}
  - {code: EE_ESIC, name: Employee ESIC, category: DEDUCTION, head_type: STATUTORY, display_order: 21}
  - {code: PT, name: Professional Tax, category: DEDUCTION, head_type: STATUTORY, display_order: 22}
  - {code: TDS, name: Income Tax (TDS), category: DEDUCTION, head_type: STATUTORY, display_order: 23}
  - {code: LWF_EE, name: Employee LWF, category: DEDUCTION, head_type: STATUTORY, display_order: 24}
  - {code: LOAN, name: Loan Recovery, category: DEDUCTION, head_type: ADHOC, display_order: 25}
  - {code: OTHER_DED, name: Other Deductions, category: DEDUCTION, head_type: ADHOC, display_order: 26}
  - {code: NOTICE_RECOVERY, name: Notice Pay Recovery, category: DEDUCTION, head_type: ADHOC, display_order: 27}

  - {code: ER_EPF, name: Employer EPF, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 40}
  - {code: EPS, name: Employer EPS, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 41}
  - {code: EDLI, name: EDLI, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 42}
  - {code: EPF_ADMIN, name: EPF Admin Charges, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 43}
  - {code: ER_ESIC, name: Employer ESIC, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 44}
  - {code: LWF_ER, name: Employer LWF, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 45}

salary_structures:
  - code: STD-2026
    version: 1
    name: Standard structure
    description: Basic 50% of gross, HRA 50% of Basic, fixed conveyance & medical, Special balances.
    effective_from: 2025-04-01
    components:
      - {head_code: BASIC, calc_type: PERCENT_OF_GROSS, value: 50, sequence: 1}
      - {head_code: HRA, calc_type: PERCENT_OF_HEAD, value: 50, base_head_code: BASIC, sequence: 2}
      - {head_code: CONVEYANCE, calc_type: FIXED, value: 1600, sequence: 3}
      - {head_code: MEDICAL, calc_type: FIXED, value: 1250, sequence: 4}
      - {head_code: SPECIAL, calc_type: BALANCING, sequence: 5}
  - code: LOW-2026
    version: 1
    name: Low wage structure
    description: Basic 60% of gross, HRA 40% of Basic, Special balances.
    effective_from: 2025-04-01
    components:
      - {head_code: BASIC, calc_type: PERCENT_OF_GROSS, value: 60, sequence: 1}
      - {head_code: HRA, calc_type: PERCENT_OF_HEAD, value: 40, base_head_code: BASIC, sequence: 2}
      - {head_code: SPECIAL, calc_type: BALANCING, sequence: 3}

