# Salary heads and structure templates (company configuration).
# Head flags drive PF / ESIC / PT / LWF / tax wage bases and proration.
# Templates split a monthly gross into earning heads when a salary is set.

salary_heads:
  # code, name, category, head_type + flags. Flags drive PF/ESIC/PT/tax wage bases.
  - {code: BASIC, name: Basic, category: EARNING, head_type: FIXED, is_taxable: true, is_pf_wage: true, is_esic_wage: true, is_pt_wage: true, is_lwf_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 1, display_group: EARNINGS, tax_treatment: TAXABLE}
  - {code: HRA, name: House Rent Allowance, category: EARNING, head_type: FIXED, is_taxable: true, is_esic_wage: true, is_pt_wage: true, is_lwf_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 2, display_group: EARNINGS, tax_treatment: EXEMPT_WITH_LIMIT, tax_note: "Exempt under s.10(13A) up to the least of the HRA limits (old regime only)"}
  - {code: SPECIAL, name: Special Allowance, category: EARNING, head_type: FIXED, is_taxable: true, is_esic_wage: true, is_pt_wage: true, is_lwf_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 3, display_group: EARNINGS, tax_treatment: TAXABLE}
  - {code: CONVEYANCE, name: Conveyance Allowance, category: EARNING, head_type: FIXED, is_taxable: true, is_esic_wage: true, is_pt_wage: true, is_lwf_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 4, display_group: ALLOWANCES, tax_treatment: TAXABLE, tax_note: "Fixed conveyance allowance is fully taxable"}
  - {code: MEDICAL, name: Medical Allowance, category: EARNING, head_type: FIXED, is_taxable: true, is_esic_wage: true, is_pt_wage: true, is_lwf_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 5, display_group: ALLOWANCES, tax_treatment: TAXABLE, tax_note: "Fixed medical allowance is fully taxable"}
  - {code: BONUS, name: Bonus, category: EARNING, head_type: VARIABLE, is_taxable: true, is_pt_wage: true, part_of_gross: true, part_of_ctc: true, display_order: 6, display_group: EARNINGS, tax_treatment: TAXABLE}
  - {code: OTHER_EARNING, name: Other Earnings, category: EARNING, head_type: ADHOC, is_taxable: true, is_pt_wage: true, part_of_gross: true, display_order: 7, display_group: EARNINGS, tax_treatment: TAXABLE}
  - {code: LEAVE_ENCASH, name: Leave Encashment, category: EARNING, head_type: ADHOC, is_taxable: true, part_of_gross: true, display_order: 8, display_group: EARNINGS, tax_treatment: TAXABLE, tax_note: "Exempt on retirement up to the notified limit"}

  # allowance heads (amounts come from each employee's structure; 0 when not part of it)
  - {code: MEAL, name: Meal Allowance, category: EARNING, head_type: FIXED, is_taxable: true, is_pt_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 9, display_group: ALLOWANCES, tax_treatment: EXEMPT_WITH_LIMIT, tax_note: "Meal vouchers exempt up to ₹50 per meal (old regime)"}
  - {code: SHIFT, name: Shift Allowance, category: EARNING, head_type: VARIABLE, is_taxable: true, is_esic_wage: true, is_pt_wage: true, part_of_gross: true, part_of_ctc: true, display_order: 10, display_group: ALLOWANCES, tax_treatment: TAXABLE}
  - {code: NIGHT, name: Night Allowance, category: EARNING, head_type: VARIABLE, is_taxable: true, is_esic_wage: true, is_pt_wage: true, part_of_gross: true, part_of_ctc: true, display_order: 11, display_group: ALLOWANCES, tax_treatment: TAXABLE}
  - {code: TELEPHONE, name: Telephone Reimbursement, category: EARNING, head_type: FIXED, part_of_ctc: true, display_order: 12, display_group: ALLOWANCES, tax_treatment: EXEMPT_ON_BILLS, tax_note: "Exempt when reimbursed against bills"}
  - {code: FUEL, name: Fuel Reimbursement, category: EARNING, head_type: FIXED, part_of_ctc: true, display_order: 13, display_group: ALLOWANCES, tax_treatment: EXEMPT_ON_BILLS, tax_note: "Exempt against bills for official use"}
  - {code: OTHER_ALLOWANCE, name: Other Allowance, category: EARNING, head_type: FIXED, is_taxable: true, is_pt_wage: true, is_prorated: true, part_of_gross: true, part_of_ctc: true, display_order: 14, display_group: ALLOWANCES, tax_treatment: TAXABLE}

  # paid only through overtime entries / pay adjustments of the month (never in a structure)
  - {code: OVERTIME, name: Overtime, category: EARNING, head_type: VARIABLE, is_taxable: true, is_esic_wage: true, is_pt_wage: true, part_of_gross: true, display_order: 15, display_group: EARNINGS, tax_treatment: TAXABLE, tax_note: "Not PF wage; counts for ESIC contribution but not ESIC coverage"}
  - {code: OTHER_EARNING_NT, name: Other Earnings (non-taxable), category: EARNING, head_type: ADHOC, part_of_gross: true, display_order: 16, display_group: EARNINGS, tax_treatment: NON_TAXABLE, tax_note: "Only for amounts exempt by law or reimbursed against bills"}

  - {code: EE_PF, name: Employee PF, category: DEDUCTION, head_type: STATUTORY, display_order: 20}
  - {code: EE_ESIC, name: Employee ESIC, category: DEDUCTION, head_type: STATUTORY, display_order: 21}
  - {code: PT, name: Professional Tax, category: DEDUCTION, head_type: STATUTORY, display_order: 22}
  - {code: TDS, name: Income Tax (TDS), category: DEDUCTION, head_type: STATUTORY, display_order: 23}
  - {code: LWF_EE, name: Employee LWF, category: DEDUCTION, head_type: STATUTORY, display_order: 24}
  - {code: LOAN, name: Loan Recovery, category: DEDUCTION, head_type: ADHOC, display_order: 25}
  - {code: OTHER_DED, name: Other Deductions, category: DEDUCTION, head_type: ADHOC, display_order: 26}
  - {code: NOTICE_RECOVERY, name: Notice Pay Recovery, category: DEDUCTION, head_type: ADHOC, display_order: 27}

  - {code: ER_EPF, name: Employer EPF, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 40}
  - {code: EPS, name: Employer EPS, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 41}
  - {code: EDLI, name: EDLI, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 42}
  - {code: EPF_ADMIN, name: EPF Admin Charges, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 43}
  - {code: ER_ESIC, name: Employer ESIC, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 44}
  - {code: LWF_ER, name: Employer LWF, category: EMPLOYER_CONTRIBUTION, head_type: STATUTORY, part_of_ctc: true, display_order: 45}

salary_structures:
  - code: STD-2026
    version: 1
    name: Standard structure
    description: Basic 50% of gross, HRA 50% of Basic, fixed conveyance & medical, Special balances.
    effective_from: 2025-04-01
    components:
      - {head_code: BASIC, calc_type: PERCENT_OF_GROSS, value: 50, sequence: 1}
      - {head_code: HRA, calc_type: PERCENT_OF_HEAD, value: 50, base_head_code: BASIC, sequence: 2}
      - {head_code: CONVEYANCE, calc_type: FIXED, value: 1600, sequence: 3}
      - {head_code: MEDICAL, calc_type: FIXED, value: 1250, sequence: 4}
      - {head_code: SPECIAL, calc_type: BALANCING, sequence: 5}
  - code: LOW-2026
    version: 1
    name: Low wage structure
    description: Basic 60% of gross, HRA 40% of Basic, Special balances.
    effective_from: 2025-04-01
    components:
      - {head_code: BASIC, calc_type: PERCENT_OF_GROSS, value: 60, sequence: 1}
      - {head_code: HRA, calc_type: PERCENT_OF_HEAD, value: 40, base_head_code: BASIC, sequence: 2}
      - {head_code: SPECIAL, calc_type: BALANCING, sequence: 3}
