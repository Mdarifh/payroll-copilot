[project]
name = "ai-payroll-copilot"
version = "0.1.0"
description = "AI Payroll Copilot - deterministic payroll engine with LangChain/LangGraph assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pyyaml>=6.0",
    # RAG (Phase 12)
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.1",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "docx2txt>=0.8",
    "rank-bm25>=0.2",
    # LLM (Phase 13) - free local models via Ollama
    "langchain-ollama>=0.2",
    "httpx>=0.27",
    # Orchestration (Phase 14)
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    # API (Phase 16)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # UI (Phase 17)
    "streamlit>=1.40",
]

[project.scripts]
payroll-copilot = "payroll_copilot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payroll_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["slow: uses the real local embedding model (skipped if not downloaded)"]

[tool.coverage.run]
source = ["payroll_copilot"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

extend-exclude = ["alembic/versions"]  # generated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # parametrize tables read better on one line

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # local alembic/ folder is not the package
known-first-party = ["payroll_copilot", "tests"]
