[project]
name = "payroll-chatbot"
version = "0.1.0"
description = "Payroll chatbot for an Indian company: deterministic payroll engine + LangGraph / LangChain agent with RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pyyaml>=6.0",
    # API + auth
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",  # login form for the Swagger "Authorize" button
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "fpdf2>=2.8",
    "openpyxl>=3.1",
    # AI: LangGraph chat graph, LangChain models / tools / retriever (RAG)
    "anthropic>=1.0",
    "langchain-core>=1.6",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",  # paused payroll runs survive a restart
    "langchain-ollama>=1.1",
    "langchain-anthropic>=1.7",
    "langchain-text-splitters>=1.1",
]

[project.scripts]
payroll-chatbot = "payroll_copilot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payroll_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["slow: long-running tests"]

[tool.coverage.run]
source = ["payroll_copilot"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

extend-exclude = ["alembic/versions"]  # generated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # parametrize tables read better on one line

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # local alembic/ folder is not the package
known-first-party = ["payroll_copilot", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
